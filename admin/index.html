<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>관리자 로그인 · AI WEB</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2308090d'/%3E%3Ctext x='16' y='22' font-family='Arial,sans-serif' font-size='16' font-weight='700' fill='%23ff7a45' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

<div class="admin-gate">
  <div class="admin-card">
    <div class="admin-card__logo">AI<span>&nbsp;</span>WEB <small style="font-family:var(--font-en);font-size:11px;letter-spacing:.1em;color:var(--text-faint);margin-left:8px;">ADMIN</small></div>
    <h1>관리자 로그인</h1>
    <p class="admin-card__sub">프로젝트 아카이브를 관리하려면 로그인하세요.</p>

    <div id="admin-notice" class="admin-notice" style="display:none;">
      설정 필요 — 관리자 로그인은 Firebase 설정 완료 후 활성화됩니다. (관리자: FIREBASE_SETUP.md 참고)
    </div>

    <div id="admin-error" class="admin-error"></div>

    <form id="admin-login-form">
      <div class="field">
        <label for="admin-email">이메일</label>
        <input type="email" id="admin-email" name="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="admin-password">비밀번호</label>
        <input type="password" id="admin-password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="pill pill--solid" id="admin-login-btn">로그인</button>
    </form>

    <p class="admin-note">이 페이지는 공개 사이트에 링크되어 있지 않으며, 사전에 발급된 관리자 계정으로만 로그인할 수 있습니다.</p>
  </div>
</div>

<script type="module" src="js/admin-login.js"></script>
</body>
</html>
